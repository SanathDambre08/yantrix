<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery — Yantrix · Robotics & Aviation Club, DYPIU</title>
<meta name="description" content="Frames, films and machines from Yantrix, the robotics and aviation club of DY Patil International University.">
<meta name="theme-color" content="#050a17">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="preload" href="assets/fonts/BigShouldersDisplay-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/main.css">
</head>
<body data-page="gallery">
<main>

  <section class="phead theme-ink">
    <div class="phead__bg"><img src="assets/gallery/yx-2.jpg" alt=""></div>
    <div class="wrap">
      <p class="crumb label"><b>04</b> / Gallery</p>
      <h1 class="display h-xl ln-group" data-now><span class="ln"><span>Frames from</span></span><span class="ln"><span>the <span class="accent">build.</span></span></span></h1>
      <div class="phead__meta">
        <p class="rv" data-now>Moments from the club. Click any photo to open it full-size; use the arrow keys to move through the set.</p>
        <span class="label muted rv" data-now id="gcount"></span>
      </div>
    </div>
  </section>

  <section class="sec theme-ink" style="padding-top:20px">
    <div class="wrap">
      <div class="filters" id="filters" role="group" aria-label="Filter gallery"></div>
      <div class="masonry" id="grid"></div>
      <p class="gnote label">Adding more photos? Drop them into <b>assets/gallery/</b> and add a line for each in <b>assets/js/data.js</b> under <b>gallery</b>.</p>
    </div>
  </section>

</main>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Media viewer">
  <button class="x" aria-label="Close">✕</button><button class="pv" aria-label="Previous">←</button><button class="nx" aria-label="Next">→</button>
  <div class="lb__m" id="lbm"></div><p class="lb__cap label" id="lbc"></p>
</div>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/gallery.js"></script>
</body>
</html>
